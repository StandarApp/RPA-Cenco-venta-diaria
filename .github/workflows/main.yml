name: RPA Cencosud Venta Diaria
on:
  schedule:
    - cron: '0 * * * *'   # cada hora en punto — 24 intentos diarios
  workflow_dispatch:
jobs:
  check_already_done:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Verificar si ya corrio exitosamente hoy
        id: check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          AYER=$(date -d "yesterday" +%Y-%m-%d 2>/dev/null || date -v-1d +%Y-%m-%d)
          echo "Verificando si ya hay datos para fecha: $AYER"
          RESPONSE=$(curl -s \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            "$SUPABASE_URL/rest/v1/ventas_cencosud?fecha=eq.$AYER&select=id&limit=1")
          echo "Respuesta Supabase: $RESPONSE"
          if echo "$RESPONSE" | grep -q '"id"'; then
            echo "Ya hay datos para $AYER — saltando ejecucion"
            echo "should_run=false" >> $GITHUB_OUTPUT
          else
            echo "No hay datos para $AYER — ejecutando RPA"
            echo "should_run=true" >> $GITHUB_OUTPUT
          fi
  rpa:
    needs: check_already_done
    if: needs.check_already_done.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4
      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: |
          pip install playwright python-dotenv pandas openpyxl xlrd supabase
          playwright install chromium
          playwright install-deps chromium
      - name: Ejecutar RPA
        env:
          CENC_USER: ${{ secrets.CENC_USER }}
          CENC_PASS: ${{ secrets.CENC_PASS }}
          HEADLESS: "true"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python rpa_venta_diaria_cencosud.py
      - name: Subir logs y descarga como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-venta-diaria-${{ github.run_id }}
          path: |
            logs/
            downloads/
          retention-days: 7
