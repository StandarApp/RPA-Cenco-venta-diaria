name: RPA Cencosud Venta Diaria
on:
  schedule:
    # Intento 1: 17:15 UTC
    - cron: '15 17 * * *'
    # Intento 2: 18:15 UTC
    - cron: '15 18 * * *'
    # Intento 3: 20:00 UTC
    - cron: '0 20 * * *'
    # Intento 4: 03:00 UTC
    - cron: '0 3 * * *'
    # Intento 5: 08:20 UTC
    - cron: '20 8 * * *'
    # Intento 6: 15:30 UTC
    - cron: '30 15 * * *'
  workflow_dispatch:

jobs:
  rpa:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install playwright python-dotenv pandas openpyxl xlrd supabase
          playwright install chromium
          playwright install-deps chromium

      - name: Ejecutar RPA
        env:
          CENC_USER: ${{ secrets.CENC_USER }}
          CENC_PASS: ${{ secrets.CENC_PASS }}
          HEADLESS: "true"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python rpa_venta_diaria_cencosud.py

      - name: Subir logs y descarga como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-venta-diaria-${{ github.run_id }}
          path: |
            logs/
            downloads/
          retention-days: 7
